<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · Rural Education Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --clay:#C1622D; --clay-dark:#9A4A1E; --clay-light:#E8935B;
    --sage:#3F5D3A; --sage-dark:#243D22; --sage-light:#6E8C63;
    --cream:#FBF4E7; --cream-warm:#F3E4C6; --paper:#FFFDF9;
    --ink:#241C14; --ink-soft:#5B5142;
    --gold:#D9A441;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* texture / background motif */
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:radial-gradient(var(--sage) 0.6px, transparent 0.6px);
    background-size:22px 22px;
    opacity:0.06;
  }
  .field-line{
    position:fixed;left:0;right:0;bottom:0;height:38vh;
    background:linear-gradient(180deg, transparent, var(--sage-light) 180%);
    opacity:0.10;
    z-index:0;
  }
  .blob{
    position:fixed;border-radius:50%;filter:blur(60px);opacity:0.28;z-index:0;
  }
  .blob-1{width:420px;height:420px;background:var(--clay-light);top:-140px;left:-140px;}
  .blob-2{width:360px;height:360px;background:var(--sage-light);bottom:-160px;right:-120px;}

  header{
    position:relative;z-index:3;
    display:flex;align-items:center;justify-content:center;
    padding:36px 24px 0;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--sage-dark);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg, var(--clay), var(--sage));
    display:flex;align-items:center;justify-content:center;
    color:var(--cream);font-family:'Fraunces',serif;font-weight:700;font-size:17px;
  }
  .brand-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:17px;letter-spacing:0.2px;
  }
  .brand-name span{color:var(--clay);}

  main{
    position:relative;z-index:3;
    min-height:calc(100vh - 96px);
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px 60px;
  }

  .wrap{
    max-width:640px;
    text-align:center;
  }

  .seed-row{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:22px;
    opacity:0;
  }
  .seed-row .dash{width:34px;height:2px;background:var(--gold);border-radius:2px;}
  .seed-row span{
    font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
    letter-spacing:3px;text-transform:uppercase;color:var(--clay-dark);
  }

  .code{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(96px,22vw,168px);
    line-height:0.9;
    letter-spacing:-2px;
    color:var(--sage-dark);
    position:relative;
    display:inline-block;
    opacity:0;
  }
  .code .zero{
    display:inline-block;
    color:var(--clay);
    position:relative;
  }
  .code .zero::after{
    content:"";
    position:absolute;
    inset:14% 10%;
    border:3px dashed var(--gold);
    border-radius:50%;
    opacity:0.55;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(24px,3.6vw,32px);
    color:var(--ink);
    margin:18px 0 12px;
    opacity:0;
  }

  p.lede{
    font-size:16px;
    line-height:1.7;
    color:var(--ink-soft);
    max-width:460px;
    margin:0 auto 36px;
    opacity:0;
  }

  .actions{
    display:flex;align-items:center;justify-content:center;
    gap:14px;flex-wrap:wrap;
    opacity:0;
  }

  .btn{
    display:inline-flex;align-items:center;gap:9px;
    padding:14px 28px;
    border-radius:999px;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.2px;
    text-decoration:none;
    cursor:pointer;
    border:none;
    transition:transform 0.28s cubic-bezier(.2,.8,.2,1), box-shadow 0.28s ease, background 0.28s ease;
  }
  .btn svg{width:17px;height:17px;flex-shrink:0;}

  .btn-primary{
    background:var(--sage);
    color:var(--cream);
    box-shadow:0 10px 24px -10px rgba(36,61,34,0.55);
  }
  .btn-primary:hover{
    background:var(--sage-dark);
    transform:translateY(-2px);
    box-shadow:0 14px 28px -10px rgba(36,61,34,0.6);
  }

  .btn-outline{
    background:transparent;
    color:var(--clay-dark);
    border:1.6px solid var(--clay);
  }
  .btn-outline:hover{
    background:var(--clay);
    color:var(--paper);
    transform:translateY(-2px);
  }

  .root-line{
    margin-top:52px;
    display:flex;align-items:center;justify-content:center;gap:12px;
    opacity:0;
  }
  .root-line .rt{
    width:64px;height:1px;background:var(--ink-soft);opacity:0.3;
  }
  .root-line span{
    font-size:12px;color:var(--ink-soft);letter-spacing:0.5px;
  }

  @media (max-width:480px){
    .actions{flex-direction:column;width:100%;}
    .btn{width:100%;justify-content:center;}
  }
</style>
</head>
<body>

  <div class="grain"></div>
  <div class="field-line"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header>
    <a href="index.html" class="brand">
      <span class="brand-mark">R</span>
      <span class="brand-name">Rural Education <span>Foundation</span></span>
    </a>
  </header>

  <main>
    <div class="wrap">

      <div class="seed-row">
        <div class="dash"></div>
        <span>Lost in the field</span>
        <div class="dash"></div>
      </div>

      <div class="code">4<span class="zero">0</span>4</div>

      <h1>This page hasn't been planted yet.</h1>
      <p class="lede">
        The page you're looking for may have moved, been renamed, or never existed.
        Let's get you back to solid ground.
      </p>

      <div class="actions">
        <button class="btn btn-outline" id="goBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Go Back
        </button>
        <a href="index.html" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-5h2v5a1 1 0 001 1h4a1 1 0 001-1V10"/></svg>
          Return to Home
        </a>
      </div>

      <div class="root-line">
        <div class="rt"></div>
        <span>ROOTED IN COMMUNITY · GROWING FUTURES</span>
        <div class="rt"></div>
      </div>

    </div>
  </main>

<script>
  document.getElementById('goBack').addEventListener('click', function(){
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  });

  if (window.gsap) {
    const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
    tl.to(".seed-row", { opacity: 1, y: 0, duration: 0.5 }, 0.1)
      .from(".code", { opacity: 0, y: 26, scale: 0.94, duration: 0.7 }, 0.15)
      .to(".code", { opacity: 1 }, 0.15)
      .to("h1", { opacity: 1, duration: 0.55 }, 0.4)
      .to("p.lede", { opacity: 1, duration: 0.55 }, 0.5)
      .to(".actions", { opacity: 1, duration: 0.55 }, 0.62)
      .to(".root-line", { opacity: 1, duration: 0.6 }, 0.78);

    gsap.to(".blob-1", { y: 26, x: 14, duration: 7, repeat: -1, yoyo: true, ease: "sine.inOut" });
    gsap.to(".blob-2", { y: -22, x: -12, duration: 8, repeat: -1, yoyo: true, ease: "sine.inOut" });
  } else {
    document.querySelectorAll('.seed-row,.code,h1,p.lede,.actions,.root-line').forEach(el => el.style.opacity = 1);
  }
</script>

</body>
</html>
